# Builds the iPhone and/or Android app in Expo's cloud (EAS).
# Run it from GitHub: Actions -> "EAS Build" -> Run workflow.
# Needs a repository secret named EXPO_TOKEN (Expo personal access token).
# iOS signing credentials must already exist on EAS (created once by an
# interactive `eas build -p ios`), because CI cannot answer Apple's 2FA prompt.
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: Build profile from eas.json
        type: choice
        options: [production, preview]
        default: production
      submit:
        description: Upload finished builds to TestFlight / Google Play (production only)
        type: boolean
        default: false

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add a repository secret named EXPO_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Type-check and lint before spending a build
        run: |
          npx tsc --noEmit
          npx expo lint
      - name: Start EAS build
        run: >
          eas build
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          --non-interactive
          --no-wait
          ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
